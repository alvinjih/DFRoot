name: Build DFRoot KO 4.14 Camellia

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout DFRoot
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libelf-dev libssl-dev

      - name: Download AArch64 Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain

      - name: Clone Kernel Source 4.14
        run: |
          git clone --depth=1 -b android-11 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

      - name: Build Kernel Module (.ko)
        run: |
          export PATH=$(pwd)/toolchain/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          cd kernel
          make mt6833_defconfig
          make -j$(nproc) modules prepare

          cd ../lkm
          make KDIR=../kernel

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dfroot-miui-camellia-4.14-ko
          path: lkm/*.ko
