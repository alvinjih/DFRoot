name: Build DFRoot KO for Camellia

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DFRoot
        uses: actions/checkout@v4

      - name: Install Toolchain and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu clang lld flex bison libssl-dev libelf-dev

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 --branch lineage-23.2 https://github.com/cristidclxvi/android_kernel_xiaomi_camellia camellia-kernel

      - name: Build DFRoot LKM Module
        run: |
          cd camellia-kernel
          make ARCH=arm64 CC=clang LLVM=1 camellian_defconfig
          make ARCH=arm64 CC=clang LLVM=1 modules_prepare
          
          cd ../lkm
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KDIR=../camellia-kernel

      - name: Upload Artifact (.ko file)
        uses: actions/upload-artifact@v4
        with:
          name: dfroot-camellia-ko
          path: lkm/*.ko
